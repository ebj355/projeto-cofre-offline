# Keep this workflow under .github/workflows at the repository root; GitHub only discovers workflows there.
name: Windows tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-test-lock.txt
      - name: Install locked test dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements-test-lock.txt
      - name: Prepare the pinned cryptography wheel for integrity checks
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path pacotes -Force | Out-Null
          python -m pip download --disable-pip-version-check --only-binary=:all: --no-deps --dest pacotes cryptography==50.0.2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $wheel = Get-ChildItem -LiteralPath pacotes -Filter 'cryptography-50.0.2-*-win_amd64.whl' | Select-Object -First 1
          if (-not $wheel) { throw 'The pinned cryptography wheel was not downloaded.' }
          $hash = (Get-FileHash -LiteralPath $wheel.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($wheel.Name)" | Set-Content -LiteralPath pacotes/SHA256.txt -Encoding ASCII
      - name: Run core and UI tests
        run: python .\testes\6_TESTE_ferramentas_dos_testes\rodar_todos.py
      - name: Run Windows-native tests
        run: python .\testes\4_TESTE_so_no_windows\teste_nativo_windows.py
      - name: Run penetration-test suite
        run: python .\testes\3_TESTE_ataques_simulados\rodar_pentest.py
      - name: Check repository integrity and secrets
        shell: pwsh
        run: |
          python .\testes\5_TESTE_ferramentas_externas\verificar_integridade_repositorio.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python .\testes\5_TESTE_ferramentas_externas\verificar_segredos.py .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

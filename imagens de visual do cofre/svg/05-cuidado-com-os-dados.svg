    <circle cx="78" cy="333" r="14" fill="#4a3719"/>
    <path d="M78 325v10m0 5v1" stroke="#f5b544" stroke-width="2.5" stroke-linecap="round"/>
    <text x="108" y="330" fill="#f4e3bf" font-size="15" font-weight="700">O backup também é sensível</text>
    <text x="108" y="358" fill="#c5b28a" font-size="13">Mantenha-o offline, com acesso restrito, e nunca envie</text>
    <text x="108" y="380" fill="#c5b28a" font-size="13">cofre.dat, chaves ou códigos de recuperação a terceiros.</text>
    <text x="108" y="408" fill="#9d8b63" font-size="12">A restauração deve ser testada sem expor dados reais.</text>

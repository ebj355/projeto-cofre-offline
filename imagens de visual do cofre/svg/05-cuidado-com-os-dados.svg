    <text x="112" y="162" fill="#f0f2f7" font-size="38" font-weight="700">Segurança também é rotina.</text>
    <text x="112" y="200" fill="#9aa2b4" font-size="18">Boas práticas para demonstrar e usar um cofre local com mais cuidado.</text>

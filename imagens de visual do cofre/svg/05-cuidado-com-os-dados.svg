    <text x="38" y="54" fill="#edf0f5" font-size="21" font-weight="700">Checklist de demonstração</text>
    <g font-size="15">
      <circle cx="58" cy="112" r="15" fill="#13291f"/><path d="m51 112 5 5 10-11" fill="none" stroke="#3dd68c" stroke-width="2.4" stroke-linecap="round"/>
      <text x="88" y="108" fill="#e4e7ef" font-weight="650">Use uma cópia de teste</text><text x="88" y="132" fill="#929bad">Nunca abra seu cofre pessoal durante a apresentação.</text>
      <circle cx="58" cy="190" r="15" fill="#13291f"/><path d="m51 190 5 5 10-11" fill="none" stroke="#3dd68c" stroke-width="2.4" stroke-linecap="round"/>
      <text x="88" y="186" fill="#e4e7ef" font-weight="650">Preencha somente dados fictícios</text><text x="88" y="210" fill="#929bad">Sem contas reais, senhas, chaves ou códigos de recuperação.</text>
      <circle cx="58" cy="268" r="15" fill="#13291f"/><path d="m51 268 5 5 10-11" fill="none" stroke="#3dd68c" stroke-width="2.4" stroke-linecap="round"/>
      <text x="88" y="264" fill="#e4e7ef" font-weight="650">Proteja capturas e arquivos</text><text x="88" y="288" fill="#929bad">Confira metadados e notificações antes de compartilhar.</text>
      <circle cx="58" cy="346" r="15" fill="#13291f"/><path d="m51 346 5 5 10-11" fill="none" stroke="#3dd68c" stroke-width="2.4" stroke-linecap="round"/>
      <text x="88" y="342" fill="#e4e7ef" font-weight="650">Guarde backups separadamente</text><text x="88" y="366" fill="#929bad">Teste a recuperação e mantenha o meio de backup protegido.</text>
      <circle cx="58" cy="424" r="15" fill="#2e2414"/><path d="M58 415v11m0 5v1" fill="none" stroke="#f5b544" stroke-width="2.5" stroke-linecap="round"/>
      <text x="88" y="420" fill="#e4e7ef" font-weight="650">Feche e limpe a demonstração</text><text x="88" y="444" fill="#bda56f">Apague a cópia descartável ao terminar, conforme seu plano.</text>
    </g>
